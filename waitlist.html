<main class="wrap"><section class="card"><h1>Contact us.</h1><p class="lead">Please fill in the form below and we’ll get back to you as soon as we can.</p>
<form id="form"><div class="grid">
<div><label>Name *</label><input name="name" required autocomplete="name"></div>
<div><label>Business name *</label><input name="businessName" required autocomplete="organization"></div>
<div><label>Phone number *</label><input name="phone" type="tel" required autocomplete="tel"></div>
<div><label>Email address *</label><input name="email" type="email" required autocomplete="email"></div>
<div style="grid-column:1/-1"><label>Any other information? (optional)</label><textarea name="notes" rows="3" placeholder="Anything else we should know about your business?"></textarea></div>
<div class="honeypot"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div>
<div style="grid-column:1/-1"><button class="button" type="submit">Contact us</button><div id="status" class="status"></div></div>
</div></form></section></main>
<script>
const form=document.getElementById('form'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();status.style.display='block';status.textContent='Submitting...';const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/waitlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Submission failed');window.location.assign('/thank-you.html')}catch(err){status.textContent=err.message+' Please try again.'}});
</script>
<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.body.classList.add('lumora-motion-ready');
  const selectors = 'main > section, main > article, main > .container > section, main > .wrap > section, main > .container > article, main > .card, main > .link-card, main .stat, main .step, main .service-card, main .service, main .post-card, #post-grid > *';
  let observer;
  const observeTargets = (root) => (root || document).querySelectorAll(selectors).forEach((target) => { if (target.dataset.lumoraMotionObserved) return; target.dataset.lumoraMotionObserved = 'true'; target.classList.add('lumora-reveal'); if (observer) observer.observe(target); else target.classList.add('lumora-visible'); });
  if ('IntersectionObserver' in window) observer = new IntersectionObserver((entries) => entries.forEach((entry) => { if (entry.isIntersecting) { entry.target.classList.add('lumora-visible'); observer.unobserve(entry.target); } }), { threshold: 0.08, rootMargin: '0px 0px -28px 0px' });
  observeTargets(); const main = document.querySelector('main');
  if (main && 'MutationObserver' in window) new MutationObserver(() => observeTargets(main)).observe(main, { childList: true, subtree: true });
})();
</script>
