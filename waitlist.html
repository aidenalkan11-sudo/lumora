:root{--cream:#fffaf6;--orange:#f37922;--charcoal:#545454;--text:#292625;--muted:#766d66;--line:#eadccf;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.top{padding:28px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--charcoal);font-size:22px}.brand img{width:38px;height:38px}.brand span{color:var(--orange)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:42px;margin:28px 0 60px;box-shadow:0 12px 35px rgba(84,84,84,.06)}h1{font-size:42px;line-height:1.05;color:var(--charcoal);margin:0 0 12px}p.lead{color:var(--muted);line-height:1.65;margin:0 0 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:800;color:var(--charcoal);margin-bottom:7px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;background:#fff;color:var(--text)}.button{border:0;width:100%;padding:15px;border-radius:999px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.status{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#fff2df;color:var(--charcoal);line-height:1.5}.honeypot{position:absolute;left:-9999px}@media(max-width:650px){.card{padding:25px}.grid{grid-template-columns:1fr}h1{font-size:35px}}
</style></head><body><header class="wrap top"><a class="brand" href="/"><img src="/lumora-icon.png" alt="Lumora Solutions"><div>Lumora<span> Solutions</span></div></a></header>
<main class="wrap"><section class="card"><h1>Join the Lumora waitlist.</h1><p class="lead">Enter your contact details and business name. We’ll review your submission and reach out when we’re ready to work with you.</p>
<form id="form"><div class="grid">
<div><label>Name *</label><input name="name" required autocomplete="name"></div>
<div><label>Business name *</label><input name="businessName" required autocomplete="organization"></div>
<div><label>Phone number *</label><input name="phone" type="tel" required autocomplete="tel"></div>
<div><label>Email address *</label><input name="email" type="email" required autocomplete="email"></div>
<div class="honeypot"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div>
<div style="grid-column:1/-1"><button class="button" type="submit">Join the waitlist</button><div id="status" class="status"></div></div>
</div></form></section></main>
<script>
const form=document.getElementById('form'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();status.style.display='block';status.textContent='Submitting...';const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/waitlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Submission failed');form.innerHTML='<h2 style="color:#545454">You’re on the waitlist.</h2><p style="color:#766d66;line-height:1.7">Thanks for your interest in Lumora Solutions. We’ll review your details and reach out when we’re ready.</p>';window.scrollTo({top:0,behavior:'smooth'})}catch(err){status.textContent=err.message+' Please try again.'}});
</script></body></html>
