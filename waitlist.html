<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the Waitlist — Lumora Solutions</title><meta name="description" content="Join the Lumora Solutions waitlist for AI automation services."><link rel="icon" href="/lumora-icon.png"><style>
:root{--cream:#fffaf6;--orange:#f37922;--charcoal:#545454;--text:#292625;--muted:#766d66;--line:#eadccf;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.top{padding:28px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--charcoal);font-size:22px}.brand img{width:38px;height:38px}.brand span{color:var(--orange)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:42px;margin:28px 0 60px;box-shadow:0 12px 35px rgba(84,84,84,.06)}h1{font-size:42px;line-height:1.05;color:var(--charcoal);margin:0 0 12px}p.lead{color:var(--muted);line-height:1.65;margin:0 0 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;color:var(--charcoal);margin-bottom:7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;background:#fff;color:var(--text)}textarea{min-height:105px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:6px}.button{border:0;width:100%;padding:15px;border-radius:999px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.status{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#fff2df;color:var(--charcoal);line-height:1.5}.honeypot{position:absolute;left:-9999px} @media(max-width:650px){.card{padding:25px}.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:35px}}
</style></head><body><header class="wrap top"><a class="brand" href="/"><img src="/lumora-icon.png" alt="Lumora Solutions"><div>Lumora<span> Solutions</span></div></a></header>
<main class="wrap"><section class="card"><h1>Join the Lumora waitlist.</h1><p class="lead">Tell us a little about your business and what you want to automate. We’ll review your details and reach out when we’re ready to work with you.</p>
<form id="form"><div class="grid">
<div><label>Full name *</label><input name="name" required autocomplete="name"></div>
<div><label>Business name *</label><input name="businessName" required></div>
<div><label>Business niche / industry *</label><input name="niche" required placeholder="e.g. Electrical, plumbing, cleaning"></div>
<div><label>Preferred contact method *</label><select name="contactMethod" required><option value="">Select one</option><option>Phone</option><option>SMS</option><option>Email</option><option>Other</option></select></div>
<div><label>Phone number</label><input name="phone" type="tel" autocomplete="tel"></div>
<div><label>Email address</label><input name="email" type="email" autocomplete="email"></div>
<div class="full"><label>Contact details for your preferred method</label><input name="contactDetails" placeholder="Add an email, phone number, or other contact detail if needed"><div class="hint">If your preferred method isn't phone, use this to provide the best contact detail.</div></div>
<div><label>Best time to contact you</label><input name="bestTime" placeholder="e.g. Weekdays after 4pm"></div>
<div><label>Business location / service area</label><input name="location" placeholder="e.g. Melbourne"></div>
<div><label>Approx. calls per month</label><select name="callVolume"><option value="">Select one</option><option>Under 20</option><option>20–50</option><option>50–100</option><option>100–250</option><option>250+</option><option>Not sure</option></select></div>
<div><label>What are you interested in?</label><input name="automationInterest" placeholder="e.g. AI receptionist, lead follow-up"></div>
<div class="full"><label>Biggest problem you want to solve</label><textarea name="problem" placeholder="What repetitive task, missed opportunity, or workflow would you like to improve?"></textarea></div>
<div class="full"><label>Anything else we should know?</label><textarea name="notes"></textarea></div>
<div class="honeypot"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div>
<div class="full"><button class="button" type="submit">Join the waitlist</button><div id="status" class="status"></div></div>
</div></form></section></main>
<script>
const form=document.getElementById('form'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();status.style.display='block';status.textContent='Submitting...';const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/waitlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Submission failed');form.innerHTML='<h2 style="color:#545454">You’re on the waitlist.</h2><p style="color:#766d66;line-height:1.7">Thanks for your interest in Lumora Solutions. We’ll review your details and reach out when we’re ready.</p>';window.scrollTo({top:0,behavior:'smooth'})}catch(err){status.textContent=err.message+' Please try again.'}});
</script></body></html>
