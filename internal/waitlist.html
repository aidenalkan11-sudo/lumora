<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumora Waitlist</title><link rel="icon" href="/lumora-icon.png"><style>body{margin:0;background:#fffaf6;color:#292625;font-family:Arial,sans-serif}.wrap{width:min(1200px,calc(100% - 30px));margin:auto}.top{padding:25px 0;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:22px;color:#545454}.brand img{width:38px}.brand span{color:#f37922}.card{background:#fff;border:1px solid #eadccf;border-radius:18px;padding:24px;margin-bottom:20px;overflow:auto}h1{color:#545454}.entry{border-top:1px solid #eadccf;padding:20px 0}.entry:first-child{border-top:0}.meta{color:#766d66;font-size:13px;margin-bottom:10px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field b{color:#545454}.field{padding:8px 0;white-space:pre-wrap}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header class="wrap top"><div class="brand"><img src="/lumora-icon.png"><div>Lumora<span> Solutions</span></div></div></header><main class="wrap"><h1>Waitlist</h1><div id="app" class="card">Loading waitlist…</div></main><script>
const app=document.getElementById('app');
const storageKey='lumora_waitlist_admin_token';
async function loadWaitlist(token, fromSaved=false){
  app.textContent='Loading waitlist…';
  try{
    const r=await fetch('/api/waitlist',{headers:{Authorization:'Bearer '+token}});
    const j=await r.json();
    if(!r.ok){
      if(fromSaved && r.status===401){
        localStorage.removeItem(storageKey);
        const replacement=prompt('Your saved waitlist password is no longer valid. Enter the admin token again:');
        if(replacement){await loadWaitlist(replacement,false);return;}
      }
      throw Error(j.error||'Unable to load waitlist');
    }
    localStorage.setItem(storageKey,token);
    if(!j.length){app.textContent='No waitlist submissions yet.';return;}
    app.innerHTML=j.map(x=>'<article class="entry"><div class="meta">'+new Date(x.submittedAt).toLocaleString('en-AU')+'</div><div class="row">'+Object.entries(x).filter(([k])=>!['id','submittedAt'].includes(k)).map(([k,v])=>'<div class="field"><b>'+String(k).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</b><br>'+String(v||'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>').join('')+'</div></article>').join('');
  }catch(e){app.textContent=e.message;}
}
const savedToken=localStorage.getItem(storageKey);
if(savedToken){loadWaitlist(savedToken,true);}
else{
  const token=prompt('Waitlist admin token');
  if(token && token.trim()) loadWaitlist(token.trim());
  else app.textContent='Access cancelled. Refresh this page to try again.';
}
</script></body></html>
